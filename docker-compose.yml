services:
  app:
    build: .
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/meetups
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-me-jwt-signing-key-at-least-32-bytes}
      DEBUG: "false"
      ALLOWED_HOSTS: localhost,127.0.0.1,app
    ports:
      - "8002:8000"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: meetups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
